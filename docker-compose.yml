services:
  mysql:
    image: mysql:8.4
    container_name: memory-wedding-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-memory_wedding}
      MYSQL_USER: ${MYSQL_USER:-memory}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-memory}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - memory-wedding

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memory-wedding-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-memory_wedding}
      MYSQL_USER: ${MYSQL_USER:-memory}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-memory}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      # Docker 안에서는 항상 볼륨 경로 사용 (호스트 상대경로 무시)
      STORAGE_LOCAL_PATH: /app/data/uploads
      GCS_BUCKET: ${GCS_BUCKET:-}
      # 컨테이너 내부 경로. 호스트 폴더는 GCS_CREDENTIALS_HOST_PATH 로 마운트
      GCS_CREDENTIALS_PATH: ${GCS_CREDENTIALS_PATH:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MAX_PHOTOS: ${GEMINI_MAX_PHOTOS:-20}
      GEMINI_MIN_CONFIDENCE: ${GEMINI_MIN_CONFIDENCE:-0.60}
      GEMINI_MAX_VIDEOS: ${GEMINI_MAX_VIDEOS:-5}
      GEMINI_VIDEO_FRAMES: ${GEMINI_VIDEO_FRAMES:-5}
    volumes:
      - upload_data:/app/data/uploads
      - ${GCS_CREDENTIALS_HOST_PATH:-./secrets}:/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - memory-wedding

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_APP_KEY:-}
    container_name: memory-wedding-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_APP_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - memory-wedding

volumes:
  mysql_data:
  upload_data:

networks:
  memory-wedding:
    driver: bridge
