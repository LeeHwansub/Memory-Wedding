spring:
  application:
    name: memory-wedding-api
  profiles:
    active: dev

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:3000
  frontend-url: http://localhost:3000
  drive:
    redirect-uri: ${DRIVE_REDIRECT_URI:http://localhost:8080/api/drive/oauth/callback}
  jwt:
    secret: change-me-in-production-use-long-random-string-at-least-32-chars
    expiration-ms: 86400000
